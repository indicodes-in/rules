name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Engine, tools, and the logic sweep over the real rules.
      - run: pnpm test
      # Schema, cross-file checks, band overlaps and gaps, page extracts.
      - run: pnpm rules:validate
      # The independent benchmark is a separate question from the checks
      # above: reported on every run, never inferred from a green build. It
      # does not fail the build while it has no cases (data/validation/).
      - name: Independent benchmark (reported, not a gate yet)
        continue-on-error: true
        run: |
          set +e
          pnpm --silent test:benchmark | tee benchmark.txt
          code=${PIPESTATUS[0]}
          { echo "### Independent benchmark"; echo '```'; tail -n 4 benchmark.txt; echo '```';
            [ "$code" = "0" ] && echo "Launch gate: met." || echo "Launch gate: **not met** — see data/validation/README.md."; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests
